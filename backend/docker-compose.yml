version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: apisecurity-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: apisecurity
      MYSQL_USER: apiuser
      MYSQL_PASSWORD: apipass123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: